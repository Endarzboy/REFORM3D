<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 64" role="img" aria-labelledby="reform3d-title reform3d-description">
  <title id="reform3d-title">REFORM-3D</title>
  <desc id="reform3d-description">Three open isometric planes frame a stable central cube. The jade plane represents acquisition robustness, muted coral represents cross-modal alignment, and warm gold represents anatomical generalization. The core represents the frozen 3D encoder under evaluation. The background and gaps are transparent. The uppercase REFORM-3D wordmark is outlined vector geometry.</desc>
