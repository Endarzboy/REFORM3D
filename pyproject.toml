[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reform3d"
version = "0.1.0"
description = "Frozen 3D medical encoder evaluation across spacing, modality, and anatomy"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<2", "torch>=2.1,<3", "monai>=1.3,<1.5", "nibabel>=5,<6", "SimpleITK>=2.3,<3", "scipy>=1.10,<2", "scikit-learn>=1.2,<2", "matplotlib>=3.7,<4", "Pillow>=10", "tqdm>=4.65", "PyYAML>=6"]

[project.optional-dependencies]
test = ["pytest>=7"]
external = ["torchvision>=0.19,<0.20", "timm>=1.0.15,<1.1"]

[project.scripts]
reform3d = "reform3d.cli:main"

[tool.setuptools]
license-files = ["LICENSE", "docs/LICENSES/*.txt", "docs/LICENSES/*.md", "docs/LICENSES/*.json"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["reform3d*"]

[tool.setuptools.package-data]
reform3d = ["external_methods/**/*.py", "external_methods/**/*.json", "external_methods/**/*.yaml", "external_methods/**/LICENSE*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
